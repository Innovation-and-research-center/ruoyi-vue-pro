version: "3.4"

name: yudao-server-kingbase

services:
  redis:
    container_name: yiwuoa-redis
    image: redis:8 # 用户指定版本
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  server:
    container_name: yiwu-oa-server
    build:
      context: ../../yudao-server # 指向项目根目录下的 yudao-server
    image: yiwu-oa-server
    restart: unless-stopped
    ports:
      - "48080:48080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS:
        ${JAVA_OPTS:-
          -Xms512m
          -Xmx512m
          -Djava.security.egd=file:/dev/./urandom
        }
      # 请将 KINGBASE_HOST 替换为您 Kingbase 数据库的实际 IP 地址
      KINGBASE_HOST: ${KINGBASE_HOST:-192.168.10.29}
      KINGBASE_PORT: ${KINGBASE_PORT:-54321}
      KINGBASE_DB: ${KINGBASE_DB:-ruoyi-vue-pro}
      ARGS:
        --spring.datasource.dynamic.datasource.master.url=jdbc:kingbase8://${KINGBASE_HOST:-192.168.10.29}:${KINGBASE_PORT:-54321}/${KINGBASE_DB:-test}?tcpKeepAlive=true&socketTimeout=0&connectTimeout=10
        --spring.datasource.dynamic.datasource.master.username=system
        --spring.datasource.dynamic.datasource.master.password=yiwu_oa
        --spring.datasource.dynamic.datasource.master.driver-class-name=com.kingbase8.Driver
        --spring.datasource.dynamic.datasource.slave.url=jdbc:kingbase8://${KINGBASE_HOST:-192.168.10.29}:${KINGBASE_PORT:-54321}/${KINGBASE_DB:-test}?tcpKeepAlive=true&socketTimeout=0&connectTimeout=10
        --spring.datasource.dynamic.datasource.slave.username=system
        --spring.datasource.dynamic.datasource.slave.password=yiwu_oa
        --spring.datasource.dynamic.datasource.slave.driver-class-name=com.kingbase8.Driver
        --spring.redis.host=192.168.10.29
    depends_on:
      - redis
    volumes:
      - ${FILE_PATH:-./file_storage}:/yiwu-oa-server/file_storage

volumes:
  redis-data:
    driver: local
